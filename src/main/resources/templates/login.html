<!DOCTYPE html><html lang="ru" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Dragon list</title><link rel="stylesheet" href="/css/app.css"></head><body><header><a class="brand" href="/notes"><img src="/images/logo.png" alt="">Dragon list</a><div class="account" th:if="${login != null}"><span th:text="${login}"></span><form th:action="@{/logout}" method="post"><button class="quiet">Выйти</button></form></div></header><main><div class="auth"><section><p class="eyebrow">ВАШИ МЫСЛИ ПОД ПРИСМОТРОМ</p><h1>С возвращением</h1><p class="muted">Войдите, чтобы открыть свои заметки.</p><p class="error" th:if="${param.error}">Неверный логин или пароль</p><p class="notice" th:if="${param.registered}">Регистрация завершена. Теперь войдите.</p><p class="notice" th:if="${param.logout}">Вы вышли из аккаунта.</p><form th:action="@{/login}" method="post"><label>Логин<input name="username" required maxlength="32" autocomplete="username" autofocus></label><label>Пароль<input name="password" type="password" required maxlength="64" autocomplete="current-password"></label><button>Войти</button></form><p>Ещё нет аккаунта? <a href="/register">Зарегистрироваться</a></p></section><img class="dragon" src="/images/dragon.png" alt="Отдыхающий дракон"></div></main><footer>Dragon list · Заметки с метками <a th:if="${!#strings.isEmpty(donationUrl)}" th:href="${donationUrl}" target="_blank" rel="noopener noreferrer">Поддержать проект ↗</a></footer></body></html>
