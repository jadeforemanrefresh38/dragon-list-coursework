<!DOCTYPE html><html lang="ru" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Dragon list</title><link rel="stylesheet" href="/css/app.css"></head><body><header><a class="brand" href="/notes"><img src="/images/logo.png" alt="">Dragon list</a><div class="account" th:if="${login != null}"><span th:text="${login}"></span><form th:action="@{/logout}" method="post"><button class="quiet">Выйти</button></form></div></header><main><a href="/notes">← Все заметки</a><article><span class="tag" th:text="${note.tag.label}"></span><h1 th:text="${note.title}"></h1><p class="muted" th:text="${#temporals.format(note.createdAt.atZone(T(java.time.ZoneId).of('Europe/Moscow')), 'dd.MM.yyyy HH:mm')} + ' (МСК)'"></p><div class="content" th:text="${note.content}"></div></article><div class="actions"><a class="button" th:href="@{/notes/{id}/edit(id=${note.id})}">Редактировать</a><form th:action="@{/notes/{id}/delete(id=${note.id})}" method="post" onsubmit="return confirm('Удалить заметку без возможности восстановления?')"><button class="danger">Удалить</button></form></div></main><footer>Dragon list · Заметки с метками <a th:if="${!#strings.isEmpty(donationUrl)}" th:href="${donationUrl}" target="_blank" rel="noopener noreferrer">Поддержать проект ↗</a></footer></body></html>
