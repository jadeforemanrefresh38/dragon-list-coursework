<!DOCTYPE html><html lang="ru" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Dragon list</title><link rel="stylesheet" href="/css/app.css"></head><body><header><a class="brand" href="/notes"><img src="/images/logo.png" alt="">Dragon list</a><div class="account" th:if="${login != null}"><span th:text="${login}"></span><form th:action="@{/logout}" method="post"><button class="quiet">Выйти</button></form></div></header><main><div class="auth"><section><p class="eyebrow">НАЧНИТЕ С ЧИСТОГО ЛИСТА</p><h1>Регистрация</h1><p class="muted">Создайте аккаунт для своих заметок.</p><form th:action="@{/register}" th:object="${form}" method="post"><label>Логин<input th:field="*{login}" required minlength="3" maxlength="32" autocomplete="username" autofocus></label><p class="hint">3–32 латинские буквы, цифры или _</p><p class="error" th:errors="*{login}"></p><label>Пароль<input name="password" type="password" required minlength="8" maxlength="64" autocomplete="new-password"></label><p class="hint">8–64 символа: латинские буквы, цифры и знаки</p><p class="error" th:errors="*{password}"></p><button>Зарегистрироваться</button></form><p>Уже есть аккаунт? <a href="/login">Войти</a></p></section><img class="dragon" src="/images/dragon.png" alt="Отдыхающий дракон"></div></main><footer>Dragon list · Заметки с метками <a th:if="${!#strings.isEmpty(donationUrl)}" th:href="${donationUrl}" target="_blank" rel="noopener noreferrer">Поддержать проект ↗</a></footer></body></html>
