<!DOCTYPE html><html lang="ru" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Регистрация — Dragon List</title><link rel="icon" href="/images/logo.png"><script src="/js/auth.js"></script><link rel="stylesheet" href="/frontend/index.css"><link rel="stylesheet" href="/css/auth.css"></head><body class="auth-page"><div class="auth-shell"><button type="button" class="auth-theme" aria-label="Переключить тему" hidden><svg class="theme-moon" viewBox="0 0 24 24"><path d="M20.8 13A9 9 0 0 1 11 3.2 9 9 0 1 0 20.8 13Z"/></svg><svg class="theme-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg></button><main class="auth-layout"><div class="auth-art"><a href="/notes" class="brand-logo auth-brand"><span class="brand-logo__name">Dragon List</span></a><img src="/images/dragon.png" alt="" class="auth-dragon"></div><section class="auth-panel"><nav class="auth-tabs"><a href="/login" >Вход</a><a href="/register" aria-current="page">Регистрация</a></nav><div class="auth-heading"><h1>Регистрация</h1></div><form th:action="@{/register}" th:object="${form}" method="post" id="auth-form"><div class="auth-field"><label for="login">Имя пользователя</label><input id="login" th:field="*{login}" required minlength="3" maxlength="32" autocomplete="username" placeholder="Введите имя пользователя" autofocus><p class="auth-hint">3–32 латинские буквы, цифры или _</p><p class="auth-field-error" th:errors="*{login}"></p></div><div class="auth-field"><label for="password">Пароль</label><div class="auth-password"><input id="password" name="password" type="password" required maxlength="64" autocomplete="new-password" placeholder="Введите пароль"><button class="auth-password-toggle" type="button" aria-label="Показать пароль" aria-controls="password" aria-pressed="false" hidden><svg viewBox="0 0 24 24"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/><path class="eye-slash" d="m3 3 18 18"/></svg></button></div></div><p class="auth-hint">8–64 символа: латинские буквы, цифры и знаки</p><p class="auth-field-error" th:errors="*{password}"></p><button class="auth-submit">Зарегистрироваться</button></form><p class="auth-switch">Уже есть аккаунт? <a href="/login">Войти</a></p></section></main></div></body></html>
