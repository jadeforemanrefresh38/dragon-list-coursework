<!DOCTYPE html><html lang="ru" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Dragon list</title><link rel="stylesheet" href="/css/app.css"></head><body><header><a class="brand" href="/notes"><img src="/images/logo.png" alt="">Dragon list</a><div class="account" th:if="${login != null}"><span th:text="${login}"></span><form th:action="@{/logout}" method="post"><button class="quiet">Выйти</button></form></div></header><main><p class="eyebrow">ЛИЧНОЕ ПРОСТРАНСТВО</p><div class="toolbar"><div><h1>Мои заметки</h1><p class="muted">Важные мысли, идеи и планы — в одном месте.</p></div><a class="button" href="/notes/new">+ Добавить заметку</a></div><form class="filter" action="/notes" method="get"><label for="tag">Метка</label><select id="tag" name="tag"><option value="">Все метки</option><option th:each="t : ${tags}" th:value="${t}" th:text="${t.label}" th:selected="${t == selectedTag}"></option></select><button class="quiet">Показать</button><a href="/notes">Сбросить</a></form><table><thead><tr><th>Заголовок</th><th>Метка</th><th>Дата</th></tr></thead><tbody><tr th:each="n : ${notes}"><td><a th:href="@{/notes/{id}(id=${n.id})}" th:text="${n.title}"></a></td><td><span class="tag" th:text="${n.tag.label}"></span></td><td th:text="${#temporals.format(n.createdAt.atZone(T(java.time.ZoneId).of('Europe/Moscow')), 'dd.MM.yyyy HH:mm')}"></td></tr></tbody></table><div class="empty" th:if="${#lists.isEmpty(notes)}"><h2>Здесь пока нет заметок</h2><p>Добавьте первую заметку или выберите другую метку.</p><img src="/images/dragon.png" alt="Дракон ждёт вашу первую заметку"></div><p class="hint">Время указано по Москве.</p></main><footer>Dragon list · Заметки с метками <a th:if="${!#strings.isEmpty(donationUrl)}" th:href="${donationUrl}" target="_blank" rel="noopener noreferrer">Поддержать проект ↗</a></footer></body></html>
