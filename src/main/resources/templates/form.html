<!DOCTYPE html><html lang="ru" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Dragon list</title><link rel="stylesheet" href="/css/app.css"></head><body><header><a class="brand" href="/notes"><img src="/images/logo.png" alt="">Dragon list</a><div class="account" th:if="${login != null}"><span th:text="${login}"></span><form th:action="@{/logout}" method="post"><button class="quiet">Выйти</button></form></div></header><main><a href="/notes">← Все заметки</a><h1 th:text="${editing ? 'Редактирование заметки' : 'Новая заметка'}"></h1><form class="editor" th:action="${editing ? '/notes/' + id + '/edit' : '/notes'}" th:object="${form}" method="post"><label>Заголовок<input th:field="*{title}" maxlength="200" required autofocus></label><p class="error" th:errors="*{title}"></p><label>Текст<textarea th:field="*{content}" maxlength="20000" rows="14" required></textarea></label><p class="error" th:errors="*{content}"></p><label>Метка<select th:field="*{tag}" required><option value="">Выберите метку</option><option th:each="t : ${tags}" th:value="${t}" th:text="${t.label}"></option></select></label><p class="error" th:errors="*{tag}"></p><div class="actions"><button>Сохранить</button><a href="/notes">Отмена</a></div></form></main><footer>Dragon list · Заметки с метками <a th:if="${!#strings.isEmpty(donationUrl)}" th:href="${donationUrl}" target="_blank" rel="noopener noreferrer">Поддержать проект ↗</a></footer></body></html>
